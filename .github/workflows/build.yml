name: build
on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Get JUCE
        run: git clone --branch 8.0.4 --depth 1 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure
        run: cmake -B build -DJUCE_DIR=${{ github.workspace }}/JUCE -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: Undertow-${{ matrix.os }}
          path: |
            build/Undertow_artefacts/Release/VST3
            build/Undertow_artefacts/Release/AU
            build/Undertow_artefacts/Release/Standalone
